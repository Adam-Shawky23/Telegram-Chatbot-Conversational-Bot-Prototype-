<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1c2030"/>
      <stop offset="100%" stop-color="#12141c"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#glow)"/>

  <g fill="#ffffff" opacity="0.045">
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4"/>
    </pattern>
    <rect width="1280" height="640" fill="url(#dots)"/>
  </g>

  <circle cx="960" cy="220" r="190" fill="#42A5D9" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1040" cy="440" r="150" fill="#F5A623" opacity="0.07" filter="url(#soft)"/>

  <!-- ===== LEFT: text block ===== -->
  <text x="80" y="188" fill="#EDEDED" font-size="52" font-weight="700" letter-spacing="-1.5">
    Prototype first.
  </text>
  <text x="80" y="252" fill="#EDEDED" font-size="52" font-weight="700" letter-spacing="-1.5">
    Then production.
  </text>

  <text x="80" y="300" fill="#9AA0AC" font-size="20" font-weight="400">
    Conversation logic validated on Telegram
  </text>
  <text x="80" y="326" fill="#9AA0AC" font-size="20" font-weight="400">
    before shipping to Instagram DMs
  </text>

  <rect x="80" y="358" width="56" height="4" fill="#42A5D9" rx="2"/>

  <g font-family="'SFMono-Regular','Menlo',monospace" font-size="15" font-weight="500">
    <g><rect x="80" y="394" width="66" height="34" rx="8" fill="#1E2230" stroke="#333A4A"/>
      <text x="113" y="416" fill="#D7DAE0" text-anchor="middle">n8n</text></g>
    <g><rect x="156" y="394" width="102" height="34" rx="8" fill="#1E2230" stroke="#333A4A"/>
      <text x="207" y="416" fill="#D7DAE0" text-anchor="middle">Gemini</text></g>
    <g><rect x="268" y="394" width="120" height="34" rx="8" fill="#1E2230" stroke="#333A4A"/>
      <text x="328" y="416" fill="#D7DAE0" text-anchor="middle">Telegram API</text></g>
    <g><rect x="398" y="394" width="146" height="34" rx="8" fill="#1E2230" stroke="#333A4A"/>
      <text x="471" y="416" fill="#D7DAE0" text-anchor="middle">Google Sheets</text></g>
  </g>

  <g transform="translate(80,466)">
    <circle cx="7" cy="0" r="6" fill="#8B92A6"/>
    <text x="26" y="6" fill="#B7BCC6" font-size="17">
      Human-handoff intent detected here — wired into action later
    </text>
  </g>

  <!-- ===== RIGHT: signature — three solid branches, one ghost/dashed branch ===== -->
  <g transform="translate(760,90)">
    <rect x="0" y="0" width="230" height="52" rx="16" fill="#242938"/>
    <text x="22" y="32" fill="#C9CDD6" font-size="16">"Do you have preorders?"</text>

    <path d="M 40 52 C 40 96, 118 96, 118 132" stroke="#4A5164" stroke-width="2" fill="none" stroke-dasharray="4 5"/>

    <g transform="translate(0,150)">
      <line x1="118" y1="0" x2="238" y2="-52" stroke="#3A4256" stroke-width="2"/>
      <line x1="118" y1="0" x2="238" y2="0" stroke="#3A4256" stroke-width="2"/>
      <line x1="118" y1="0" x2="238" y2="52" stroke="#3A4256" stroke-width="2"/>
      <line x1="118" y1="0" x2="238" y2="104" stroke="#5A6274" stroke-width="2" stroke-dasharray="3 5"/>

      <circle cx="118" cy="0" r="22" fill="#1E2230" stroke="#42A5D9" stroke-width="2.5"/>
      <text x="118" y="6" fill="#42A5D9" font-size="13" text-anchor="middle" font-weight="700">AI</text>

      <circle cx="238" cy="-52" r="15" fill="#1E2230" stroke="#4A5164" stroke-width="2"/>
      <text x="266" y="-47" fill="#8B92A6" font-size="13">Product Info</text>

      <circle cx="238" cy="0" r="15" fill="#1E2230" stroke="#4A5164" stroke-width="2"/>
      <text x="266" y="5" fill="#8B92A6" font-size="13">Order Requests</text>

      <circle cx="238" cy="52" r="15" fill="#1E2230" stroke="#4A5164" stroke-width="2"/>
      <text x="266" y="57" fill="#8B92A6" font-size="13">General Info</text>

      <circle cx="238" cy="104" r="15" fill="none" stroke="#5A6274" stroke-width="2" stroke-dasharray="3 4"/>
      <text x="266" y="109" fill="#5A6274" font-size="13" font-style="italic">Human handoff — TBD</text>
    </g>
  </g>

  <text x="80" y="580" fill="#5C6270" font-size="15" font-family="'SFMono-Regular','Menlo',monospace">
    intent classification · knowledge base · conversational memory
  </text>
</svg>
